server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-url-shortener
  datasource:
    url: ${DB_URL:jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code-length: ${APP_SHORT_CODE_LENGTH:8}
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LW92ZXItMzItYnl0ZXM=}
    expiration: ${JWT_EXPIRATION:PT1H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

